<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Tanks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1000" height="600"></canvas>
    <div id="hud">
      <div class="top">
        <div class="panel" id="p1"><b>PLAYER 1</b><div class="hp"><i></i></div><span class="score">0 pts</span></div>
        <div class="center"><div id="turn"></div><div id="wind"></div></div>
        <div class="panel right" id="p2"><b>PLAYER 2</b><div class="hp"><i></i></div><span class="score">0 pts</span></div>
      </div>
      <div class="bottom">
        <div class="stat"><span>ANGLE</span><div><b id="angle">45</b>&deg;</div></div>
        <div class="stat"><span>POWER</span><div><b id="power">50</b></div><div class="bar"><i id="powerBar"></i></div></div>
        <div class="weapons" id="weapons"></div>
        <button id="fire">FIRE</button>
      </div>
      <div id="banner" hidden></div>
    </div>
  </div>
  <p class="help">&larr;/&rarr; angle &middot; &uarr;/&darr; power &middot; Shift = fine &middot; 1-3 / Tab weapon &middot; Space fire &middot; drag on canvas to aim &middot; R restart</p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
